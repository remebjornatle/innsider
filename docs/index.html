<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innsider — Oslo Børs Insider Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent-buy: #22c55e;
      --accent-sell: #ef4444;
      --accent-blue: #6366f1;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-title span { color: var(--text-muted); font-size: 0.85rem; }
    .header-meta { font-size: 0.78rem; color: var(--text-muted); text-align: right; }
    .header-meta a { color: var(--text-muted); text-decoration: none; }
    .header-meta a:hover { color: var(--text); }

    main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.82rem;
    }
    .stat-chip strong { color: var(--text); margin-right: 4px; }
    .stat-chip span { color: var(--text-muted); }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-buy { background: var(--accent-buy); }
    .dot-sell { background: var(--accent-sell); }
    .card-header h2 { font-size: 0.95rem; font-weight: 600; }
    .chart-wrap { position: relative; height: 320px; }

    .table-card { overflow: hidden; }
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-header h2 { font-size: 0.95rem; font-weight: 600; }
    .filter-btns { display: flex; gap: 6px; }
    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--text); border-color: var(--accent-blue); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    th {
      text-align: left;
      padding: 8px 12px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .badge-buy { background: rgba(34,197,94,0.15); color: var(--accent-buy); }
    .badge-sell { background: rgba(239,68,68,0.15); color: var(--accent-sell); }
    .ticker-chip {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.2px;
    }
    .value-cell { font-variant-numeric: tabular-nums; }
    .text-muted { color: var(--text-muted); }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 12px;
      color: var(--text-muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #f87171; font-size: 0.88rem; padding: 12px; }
    .empty-msg { color: var(--text-muted); font-size: 0.85rem; padding: 20px 12px; }
  </style>
</head>
<body>
<header>
  <div class="header-title">
    <h1>Innsider</h1>
    <span>Oslo Børs insider trading movements · last 90 days</span>
  </div>
  <div class="header-meta" id="headerMeta">
    Data updated daily via GitHub Actions<br>
    <a href="https://github.com/remebjornatle/innsider" target="_blank">View source ↗</a>
  </div>
</header>

<main>
  <div class="status-bar" id="statusBar">
    <div class="loading" style="height:auto;flex-direction:row;gap:8px">
      <div class="spinner" style="width:18px;height:18px;border-width:2px"></div>
      <span>Loading…</span>
    </div>
  </div>

  <div class="charts-grid">
    <div class="card">
      <div class="card-header">
        <div class="dot dot-buy"></div>
        <h2>Top Insider Buys — Total NOK Value</h2>
      </div>
      <div class="chart-wrap" id="buyChartWrap">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="dot dot-sell"></div>
        <h2>Top Insider Sells — Total NOK Value</h2>
      </div>
      <div class="chart-wrap" id="sellChartWrap">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="table-header">
      <h2>Individual Trades</h2>
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="buy">Buys</button>
        <button class="filter-btn" data-filter="sell">Sells</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
    </div>
  </div>
</main>

<script>
let currentFilter = 'all';
let allTrades = [];
let buyChart = null;
let sellChart = null;

const fmt = new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 0 });
const fmtM = v => {
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return fmt.format(v);
};

async function loadData() {
  let data;
  try {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    const err = `<div class="error-msg">Failed to load data: ${e.message}</div>`;
    document.getElementById('statusBar').innerHTML = err;
    document.getElementById('buyChartWrap').innerHTML = err;
    document.getElementById('sellChartWrap').innerHTML = err;
    document.getElementById('tableWrap').innerHTML = err;
    return;
  }

  allTrades = data.trades || [];

  // Last-updated in header
  if (data.generated_at) {
    const d = new Date(data.generated_at);
    document.getElementById('headerMeta').innerHTML =
      `Updated ${d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})} ` +
      `at ${d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})} UTC<br>` +
      `<a href="https://github.com/remebjornatle/innsider" target="_blank">View source ↗</a>`;
  }

  // Status bar
  const totalBuy = (data.top_buys || []).reduce((s, x) => s + x.value, 0);
  const totalSell = (data.top_sells || []).reduce((s, x) => s + x.value, 0);
  document.getElementById('statusBar').innerHTML = `
    <div class="stat-chip"><strong>${data.total_parsed}</strong><span>parsed trades</span></div>
    <div class="stat-chip"><strong>${data.from_date}</strong><span> to </span><strong>${data.to_date}</strong></div>
    <div class="stat-chip" style="color:var(--accent-buy)"><strong>NOK ${fmtM(totalBuy)}</strong><span style="color:var(--text-muted)"> total bought</span></div>
    <div class="stat-chip" style="color:var(--accent-sell)"><strong>NOK ${fmtM(totalSell)}</strong><span style="color:var(--text-muted)"> total sold</span></div>
  `;

  renderBarChart('buyChartWrap', data.top_buys, 'buy', buyChart, c => buyChart = c);
  renderBarChart('sellChartWrap', data.top_sells, 'sell', sellChart, c => sellChart = c);
  renderTable(allTrades, currentFilter);
}

function renderBarChart(wrapperId, items, type, existingChart, setChart) {
  const wrap = document.getElementById(wrapperId);
  if (!items || items.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">No data found for this period.</div>';
    return;
  }

  wrap.innerHTML = '<canvas></canvas>';
  const canvas = wrap.querySelector('canvas');
  canvas.style.display = 'block';

  if (existingChart) existingChart.destroy();

  const color = type === 'buy' ? '#22c55e' : '#ef4444';
  const colorAlpha = type === 'buy' ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)';
  const labels = items.map(x => x.ticker);
  const values = items.map(x => x.value);
  const tooltipCompanies = items.map(x => x.company);
  const tooltipTrades = items.map(x => x.trades);

  const chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colorAlpha,
        borderColor: color,
        borderWidth: 1.5,
        borderRadius: 4,
        hoverBackgroundColor: color + '33',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (ctx) => `${ctx[0].label} — ${tooltipCompanies[ctx[0].dataIndex]}`,
            label: (ctx) => [
              `  Total: NOK ${fmt.format(ctx.raw)}`,
              `  Trades: ${tooltipTrades[ctx.dataIndex]}`,
            ],
          },
          backgroundColor: '#1a1d27',
          borderColor: '#2e3350',
          borderWidth: 1,
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          padding: 10,
        }
      },
      scales: {
        x: {
          ticks: { color: '#94a3b8', font: { size: 11 } },
          grid: { display: false },
          border: { color: '#2e3350' },
        },
        y: {
          ticks: {
            color: '#94a3b8',
            font: { size: 11 },
            callback: v => 'NOK ' + fmtM(v),
          },
          grid: { color: '#1f2335' },
          border: { color: '#2e3350' },
        }
      }
    }
  });
  setChart(chart);
}

function renderTable(trades, filter) {
  const wrap = document.getElementById('tableWrap');
  const filtered = filter === 'all' ? trades : trades.filter(t => t.action === filter);

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">No trades to show for the current filter.</div>';
    return;
  }

  const rows = filtered.map(t => `
    <tr>
      <td>${t.date}</td>
      <td><span class="ticker-chip">${escHtml(t.ticker)}</span></td>
      <td class="text-muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${escHtml(t.company)}</td>
      <td><span class="badge badge-${t.action}">${t.action.toUpperCase()}</span></td>
      <td class="value-cell">${fmt.format(t.shares)}</td>
      <td class="value-cell">NOK ${t.price.toLocaleString('nb-NO', {minimumFractionDigits: 2, maximumFractionDigits: 4})}</td>
      <td class="value-cell" style="color:${t.action==='buy'?'var(--accent-buy)':'var(--accent-sell)'}">
        NOK ${fmt.format(t.value)}
      </td>
      <td>
        <a href="https://newsweb.oslobors.no/message/${t.messageId}" target="_blank" style="color:var(--text-muted);text-decoration:none;font-size:0.78rem">↗ View</a>
      </td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Ticker</th>
          <th>Company</th>
          <th>Action</th>
          <th>Shares</th>
          <th>Price / share</th>
          <th>Total value</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable(allTrades, currentFilter);
  });
});

loadData();
</script>
</body>
</html>
