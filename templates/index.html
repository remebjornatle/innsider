<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innsider — Oslo Børs Insider Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent-buy: #22c55e;
      --accent-sell: #ef4444;
      --accent-blue: #6366f1;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-title span { color: var(--text-muted); font-size: 0.85rem; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .range-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .range-btn:hover { border-color: var(--accent-blue); color: var(--text); }
    .range-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .refresh-btn:hover { border-color: var(--text-muted); color: var(--text); }

    main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.82rem;
    }
    .stat-chip strong { color: var(--text); margin-right: 4px; }
    .stat-chip span { color: var(--text-muted); }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-buy { background: var(--accent-buy); }
    .dot-sell { background: var(--accent-sell); }
    .card-header h2 { font-size: 0.95rem; font-weight: 600; }
    .chart-wrap { position: relative; height: 320px; }

    .table-card { overflow: hidden; }
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-header h2 { font-size: 0.95rem; font-weight: 600; }
    .filter-btns { display: flex; gap: 6px; }
    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--text); border-color: var(--accent-blue); }

    .view-switcher { margin-bottom: 20px; }
    .view-btns { display: flex; gap: 6px; margin-bottom: 10px; }
    .view-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.83rem;
      transition: all 0.15s;
    }
    .view-btn:hover { border-color: var(--accent-blue); color: var(--text); }
    .view-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }
    .view-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 900px;
    }
    .view-desc strong { color: var(--text); font-weight: 600; }
    .view-desc .pro { color: var(--accent-buy); }
    .view-desc .con { color: var(--accent-sell); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    th {
      text-align: left;
      padding: 8px 12px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .badge-buy { background: rgba(34,197,94,0.15); color: var(--accent-buy); }
    .badge-sell { background: rgba(239,68,68,0.15); color: var(--accent-sell); }
    .ticker-chip {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.2px;
    }
    .value-cell { font-variant-numeric: tabular-nums; }
    .text-muted { color: var(--text-muted); }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 12px;
      color: var(--text-muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #f87171; font-size: 0.88rem; padding: 12px; }
    .empty-msg { color: var(--text-muted); font-size: 0.85rem; padding: 20px 12px; }
  </style>
</head>
<body>
<header>
  <div class="header-title">
    <h1>Innsider</h1>
    <span>Oslo Børs insider trading movements</span>
  </div>
  <div class="controls">
    <button class="range-btn" data-days="7">7d</button>
    <button class="range-btn" data-days="30">30d</button>
    <button class="range-btn active" data-days="90">90d</button>
    <button class="range-btn" data-days="180">180d</button>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>
</header>

<main>
  <div class="status-bar" id="statusBar"></div>

  <div class="view-switcher">
    <div class="view-btns" id="viewBtns">
      <button class="view-btn active" data-view="value">By Value</button>
      <button class="view-btn" data-view="liquidity">By Liquidity</button>
      <button class="view-btn" data-view="insiders">By Insiders</button>
    </div>
    <p class="view-desc" id="viewDesc"></p>
  </div>

  <div class="charts-grid">
    <div class="card">
      <div class="card-header">
        <div class="dot dot-buy"></div>
        <h2 id="buyChartTitle">Top Insider Buys — Total NOK Value</h2>
      </div>
      <div class="chart-wrap" id="buyChartWrap">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="dot dot-sell"></div>
        <h2 id="sellChartTitle">Top Insider Sells — Total NOK Value</h2>
      </div>
      <div class="chart-wrap" id="sellChartWrap">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="table-header">
      <h2>Individual Trades</h2>
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="buy">Buys</button>
        <button class="filter-btn" data-filter="sell">Sells</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
    </div>
  </div>
</main>

<script>
let currentDays = 90;
let currentFilter = 'all';
let currentView = 'value';
let latestData = null;
let allTrades = [];
let buyChart = null;
let sellChart = null;

const fmt = new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 0 });
const fmtM = v => {
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return fmt.format(v);
};

// Each view ranks tickers by a different metric, on purpose — each one is
// biased in its own way, so they're offered side by side rather than merged
// into a single "correct" score.
const VIEWS = {
  value: {
    label: 'Total NOK Value',
    dataKey: 'by_value',
    metric: x => x.value,
    axisFmt: v => 'NOK ' + fmtM(v),
    tooltipLine: x => `Total: NOK ${fmt.format(x.value)}`,
    desc: '<strong>Total NOK traded.</strong> ' +
      '<span class="pro">+ Shows real money at stake.</span> ' +
      '<span class="con">− Favors large, liquid companies, since insiders there routinely trade in bigger blocks even without any particular signal behind it.</span>',
  },
  liquidity: {
    label: '% of Avg. Daily Volume',
    dataKey: 'by_liquidity',
    metric: x => x.pct_adv,
    axisFmt: v => v.toFixed(0) + '%',
    tooltipLine: x => x.pct_adv != null ? `${x.pct_adv}% of avg. daily volume (NOK ${fmtM(x.avg_daily_value)}/day)` : 'Liquidity data unavailable',
    desc: '<strong>Trade value as a share of the stock’s typical daily trading volume.</strong> ' +
      '<span class="pro">+ Flags trades that are unusual for that specific stock, which corrects the large-cap bias in the value view.</span> ' +
      '<span class="con">− Thinly-traded small caps can dominate from modest NOK amounts, and it’s based on a 1-month average volume so still noisy for illiquid names.</span>',
  },
  insiders: {
    label: 'Distinct Insiders',
    dataKey: 'by_insiders',
    metric: x => x.insiders,
    axisFmt: v => v.toFixed(0),
    yStepSize: 1,
    tooltipLine: x => `${x.insiders} distinct insider${x.insiders === 1 ? '' : 's'}`,
    desc: '<strong>Number of different insiders trading, not trade size.</strong> ' +
      '<span class="pro">+ Multiple people acting independently is a harder signal to explain away than one person’s large trade — the classic "cluster buying/selling" pattern.</span> ' +
      '<span class="con">− Ignores size entirely, and name-matching is best-effort: some announcement formats aren’t recognized, so counts can undercount.</span>',
  },
};

async function loadData(days) {
  document.getElementById('statusBar').innerHTML = '';
  document.getElementById('buyChartWrap').innerHTML = '<div class="loading"><div class="spinner"></div><span>Fetching insider trades…</span></div>';
  document.getElementById('sellChartWrap').innerHTML = '<div class="loading"><div class="spinner"></div><span>Fetching insider trades…</span></div>';
  document.getElementById('tableWrap').innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading…</span></div>';

  let data;
  try {
    const res = await fetch(`/api/trades?days=${days}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    const err = `<div class="error-msg">Failed to load data: ${e.message}</div>`;
    document.getElementById('buyChartWrap').innerHTML = err;
    document.getElementById('sellChartWrap').innerHTML = err;
    document.getElementById('tableWrap').innerHTML = err;
    return;
  }

  latestData = data;
  allTrades = data.trades || [];

  // Status bar
  document.getElementById('statusBar').innerHTML = `
    <div class="stat-chip"><strong>${data.total_parsed}</strong><span>parsed trades</span></div>
    <div class="stat-chip"><strong>${data.from_date}</strong><span>to</span><strong style="margin-left:4px">${data.to_date}</strong></div>
    <div class="stat-chip" style="color:var(--accent-buy)"><strong>NOK ${fmtM(data.total_buy_value || 0)}</strong><span style="color:var(--text-muted)"> total bought</span></div>
    <div class="stat-chip" style="color:var(--accent-sell)"><strong>NOK ${fmtM(data.total_sell_value || 0)}</strong><span style="color:var(--text-muted)"> total sold</span></div>
  `;

  renderView();
  renderTable(allTrades, currentFilter);
}

function renderView() {
  const view = VIEWS[currentView];
  document.getElementById('viewDesc').innerHTML = view.desc;
  document.getElementById('buyChartTitle').textContent = `Top Insider Buys — ${view.label}`;
  document.getElementById('sellChartTitle').textContent = `Top Insider Sells — ${view.label}`;

  if (!latestData) return;
  buyChart = renderBarChart('buyChartWrap', latestData.buys[view.dataKey], 'buy', buyChart, view);
  sellChart = renderBarChart('sellChartWrap', latestData.sells[view.dataKey], 'sell', sellChart, view);
}

function renderBarChart(wrapperId, items, type, existingChart, view) {
  const wrap = document.getElementById(wrapperId);
  if (existingChart) existingChart.destroy();

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">No data found for this view.</div>';
    return null;
  }

  wrap.innerHTML = '<canvas></canvas>';
  const canvas = wrap.querySelector('canvas');
  canvas.style.display = 'block';

  const color = type === 'buy' ? '#22c55e' : '#ef4444';
  const colorAlpha = type === 'buy' ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)';
  const labels = items.map(x => x.ticker);
  const values = items.map(x => view.metric(x));

  const chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colorAlpha,
        borderColor: color,
        borderWidth: 1.5,
        borderRadius: 4,
        hoverBackgroundColor: color + '33',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (ctx) => `${ctx[0].label} — ${items[ctx[0].dataIndex].company}`,
            label: (ctx) => [
              `  ${view.tooltipLine(items[ctx.dataIndex])}`,
              `  Trades: ${items[ctx.dataIndex].trades}  ·  Insiders: ${items[ctx.dataIndex].insiders}`,
            ],
          },
          backgroundColor: '#1a1d27',
          borderColor: '#2e3350',
          borderWidth: 1,
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          padding: 10,
        }
      },
      scales: {
        x: {
          ticks: { color: '#94a3b8', font: { size: 11 } },
          grid: { display: false },
          border: { color: '#2e3350' },
        },
        y: {
          ticks: {
            color: '#94a3b8',
            font: { size: 11 },
            callback: view.axisFmt,
          },
          ...(view.yStepSize ? { ticks: { color: '#94a3b8', font: { size: 11 }, callback: view.axisFmt, stepSize: view.yStepSize } } : {}),
          grid: { color: '#1f2335' },
          border: { color: '#2e3350' },
        }
      }
    }
  });
  return chart;
}

function renderTable(trades, filter) {
  const wrap = document.getElementById('tableWrap');
  const filtered = filter === 'all' ? trades : trades.filter(t => t.action === filter);

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-msg">No trades to show for the current filter.</div>';
    return;
  }

  const rows = filtered.map(t => `
    <tr>
      <td>${t.date}</td>
      <td><span class="ticker-chip">${escHtml(t.ticker)}</span></td>
      <td class="text-muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${escHtml(t.company)}</td>
      <td class="text-muted">${t.insider ? escHtml(t.insider) : '—'}</td>
      <td><span class="badge badge-${t.action}">${t.action.toUpperCase()}</span></td>
      <td class="value-cell">${fmt.format(t.shares)}</td>
      <td class="value-cell">NOK ${t.price.toLocaleString('nb-NO', {minimumFractionDigits: 2, maximumFractionDigits: 4})}</td>
      <td class="value-cell" style="color:${t.action==='buy'?'var(--accent-buy)':'var(--accent-sell)'}">
        NOK ${fmt.format(t.value)}
      </td>
      <td>
        <a href="https://newsweb.oslobors.no/message/${t.messageId}" target="_blank" style="color:var(--text-muted);text-decoration:none;font-size:0.78rem">↗ View</a>
      </td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Ticker</th>
          <th>Company</th>
          <th>Insider</th>
          <th>Action</th>
          <th>Shares</th>
          <th>Price / share</th>
          <th>Total value</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Range buttons
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDays = parseInt(btn.dataset.days);
    loadData(currentDays);
  });
});

// Refresh button
document.getElementById('refreshBtn').addEventListener('click', () => loadData(currentDays));

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable(allTrades, currentFilter);
  });
});

// View buttons
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    renderView();
  });
});

document.getElementById('viewDesc').innerHTML = VIEWS.value.desc;
loadData(currentDays);
</script>
</body>
</html>
